<!DOCTYPE html>
<html lang="zh">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>TaskHub - 任务大厅</title>

    <link rel="icon" href="assets/logo-icon.png" type="image/png">

    <link
        rel="stylesheet"
        href="style.css">

    <style>

        /* =========================
           任务大厅独立页
        ========================= */

        body.tasks-body {
            margin: 0;
            min-height: 100vh;
            background: #0c0f15;
            color: #e8ecf2;
            font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
        }

        .tasks-header {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 14px 28px;
            background: rgba(12, 15, 21, 0.88);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #1d222c;
        }

        .tasks-logo-link {
            display: flex;
            align-items: center;
            gap: 11px;
            text-decoration: none;
            color: inherit;
        }

        .tasks-logo-icon {
            background: linear-gradient(135deg, #6d5dfc, #4c8dff);
            color: #fff;
            box-shadow: 0 4px 14px rgba(109, 93, 252, 0.35);
        }

        .tasks-logo-text {
            font-size: 18px;
            font-weight: 700;
            color: #f5f7fa;
        }

        .tasks-header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .tasks-back-btn {
            display: inline-flex;
            align-items: center;
            padding: 9px 16px;
            border-radius: 10px;
            border: 1px solid #2a303a;
            background: rgba(255, 255, 255, 0.04);
            color: #c6ccd6;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.18s ease;
        }

        .tasks-back-btn:hover {
            border-color: #6d5dfc;
            background: rgba(109, 93, 252, 0.12);
            color: #fff;
        }

        .tasks-logout-btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 9px 16px;
            border-radius: 10px;
            border: 1px solid #2a303a;
            background: rgba(255, 255, 255, 0.04);
            color: #c6ccd6;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.18s ease;
        }

        .tasks-logout-btn:hover {
            border-color: rgba(255, 82, 82, 0.5);
            background: rgba(255, 82, 82, 0.1);
            color: #ff8a8a;
        }

        .tasks-main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 34px 28px 60px;
        }

        .tasks-main .dashboard-section-title {
            margin-bottom: 26px;
        }

        .tasks-hint {
            margin: -14px 0 24px;
            font-size: 12px;
            color: #5c6470;
        }

        .tasks-page .dashboard-task-grid {
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        @media (max-width: 640px) {

            .tasks-header {
                padding: 12px 16px;
            }

            .tasks-logo-text {
                display: none;
            }

            .tasks-back-btn span,
            .tasks-logout-btn span {
                display: none;
            }

            .tasks-main {
                padding: 24px 16px 48px;
            }

        }

        /* =========================
           刷单任务：订单总价 + 预计佣金
        ========================= */

        .ht-commission {
            margin-top: 10px;
            padding: 9px 11px;
            border-radius: 12px;
            background: rgba(34, 197, 94, 0.10);
            border: 1px solid rgba(34, 197, 94, 0.28);
            display: grid;
            gap: 4px;
        }

        .ht-commission > div {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .ht-commission span {
            font-size: 12px;
            color: #94a3b8;
        }

        .ht-commission b {
            font-size: 13px;
            color: #e2e8f0;
            font-weight: 700;
        }

        .ht-commission .ht-commission-value {
            font-size: 15px;
            color: #22c55e;
        }

        /* =========================
           侧边导航（与 dashboard 一致，滑出式）
        ========================= */

        .tasks-header .sidebar-toggle {
            margin-bottom: 0;
            flex: none;
        }

        @media (min-width: 601px) {

            body.tasks-body .sidebar {
                transform: translateX(-100%);
                transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
                z-index: 210;
                box-shadow: 30px 0 60px rgba(0, 0, 0, 0.35);
            }

            body.tasks-body .sidebar-edge-zone:hover + .sidebar,
            body.tasks-body .sidebar:hover,
            body.tasks-body .sidebar:focus-within {
                transform: translateX(0);
            }

            body.tasks-body .sidebar-edge-zone:hover,
            body.tasks-body .sidebar:hover ~ .sidebar-edge-zone {
                opacity: 0.35;
            }

        }
        /* ---------- 任务分类筛选条 ---------- */
        .task-filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 0 0 20px;
        }

        .tf-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            border-radius: 999px;
            border: 1px solid rgba(148, 163, 184, 0.22);
            background: rgba(255, 255, 255, 0.04);
            color: #9aa4b2;
            font-size: 12.5px;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tf-btn:hover {
            border-color: rgba(109, 93, 252, 0.5);
            color: #dbe1ea;
        }

        .tf-btn.on {
            background: var(--brand-gradient, linear-gradient(135deg, #6d5dfc, #8b5cf6));
            color: #fff;
            border-color: transparent;
            box-shadow: 0 4px 14px rgba(109, 93, 252, 0.35);
        }

        .tf-count {
            font-size: 10.5px;
            min-width: 18px;
            height: 18px;
            padding: 0 5px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.1);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: inherit;
        }

        .tf-btn.on .tf-count {
            background: rgba(255, 255, 255, 0.22);
        }


        /* ============================================
           PSD 任务中心浅色风格（本地改造，待确认）
        ============================================ */
        body.tasks-body {
            background: #ffffff !important;
            color: #111111;
        }
        body.tasks-body .tasks-header {
            background: #ffffff !important;
            border: 1px solid #ececec !important;
            border-radius: 0 !important;
            box-shadow: none !important;
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
        }
        .tasks-logo-text { color: #111111; }
        .tasks-logo-icon { box-shadow: none; }
        .tasks-header .sidebar-toggle,
        .tasks-header .lang-btn {
            border-color: #e4e4e4;
            background: #f7f7f7;
            color: #222;
        }
        .tasks-header .sidebar-toggle:hover,
        .tasks-header .lang-btn:hover { border-color: #111; color: #111; }
        .tasks-main .dashboard-section-title .section-label { color: #9a9a9a; }
        .tasks-main .dashboard-section-title h2 { color: #111; }
        .tasks-hint { color: #8a8a8a; }

        /* 分类 tab：PSD 下划线式 */
        .task-filter-bar {
            display: flex;
            flex-wrap: nowrap;
            gap: 0;
            margin: 0 0 16px;
            border-bottom: 1px solid #eeeeee;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .task-filter-bar::-webkit-scrollbar { display: none; }
        .tf-btn {
            flex: 1;
            min-width: max-content;
            padding: 12px 14px;
            border-radius: 0;
            border: none;
            border-bottom: 2.5px solid transparent;
            margin-bottom: -1px;
            background: transparent;
            color: #9a9a9a;
            font-size: 14px;
            font-family: inherit;
            white-space: nowrap;
            cursor: pointer;
            transition: color 0.18s;
        }
        .tf-btn:hover { color: #111; }
        .tf-btn.on {
            background: transparent;
            color: #111;
            border-bottom-color: #111;
            box-shadow: none;
            font-weight: 600;
        }
        .tf-count {
            background: #f0f0f0;
            color: #666;
            font-size: 10.5px;
            min-width: 18px;
            height: 18px;
            padding: 0 5px;
            border-radius: 999px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .tf-btn.on .tf-count { background: #111; color: #fff; }

        body.tasks-body .empty-box,
        body.tasks-body .loading-box {
            background: #f7f7f7 !important;
            border: 1px solid #eeeeee !important;
            border-radius: 12px !important;
            box-shadow: none !important;
            backdrop-filter: none !important;
            color: #888888;
        }

        /* 表头 */
        .ht-table-head {
            display: grid;
            grid-template-columns: 76px 1fr 112px 132px;
            gap: 12px;
            align-items: center;
            padding: 10px 16px;
            background: #f7f7f7;
            border-radius: 8px 8px 0 0;
            font-size: 12.5px;
            font-weight: 600;
            color: #8a8a8a;
        }
        .ht-table-head span { text-align: center; }
        .ht-table-head span:nth-child(2) { text-align: left; }

        /* 任务列表：PSD 行式 */
        #taskList.dashboard-task-grid {
            display: block;
            grid-template-columns: none;
            gap: 0;
            border: 1px solid #eeeeee;
            border-top: none;
            border-radius: 0 0 8px 8px;
            overflow: hidden;
            background: #fff;
        }
        .ht-row {
            display: grid;
            grid-template-columns: 76px 1fr 112px 132px;
            gap: 12px;
            align-items: center;
            padding: 13px 16px;
            border-bottom: 1px solid #f2f2f2;
            background: #fff;
        }
        .ht-row:last-child { border-bottom: none; }
        .ht-row:hover { background: #fafafa; }
        .ht-row-thumb {
            width: 62px; height: 62px;
            border-radius: 50%;
            overflow: hidden;
            background: #f2f2f2;
            display: flex; align-items: center; justify-content: center;
            flex: none;
        }
        .ht-row-thumb img { width: 100%; height: 100%; object-fit: cover; }
        .ht-row-thumb .ph { font-size: 22px; color: #b8b8b8; }
        .ht-row-name { min-width: 0; text-align: left; }
        .ht-row-title {
            display: flex; align-items: center; gap: 7px;
            font-size: 14.5px; font-weight: 600; color: #111;
        }
        .ht-row-type {
            flex: none;
            font-size: 10.5px;
            padding: 2px 8px;
            border-radius: 999px;
            color: #fff;
            background: #111;
            white-space: nowrap;
        }
        .ht-row-type.like { background: #3b82f6; }
        .ht-row-type.review { background: #f59e0b; }
        .ht-row-type.follow { background: #10b981; }
        .ht-row-sub {
            margin-top: 5px;
            font-size: 12px;
            color: #8a8a8a;
            line-height: 1.5;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }
        .ht-row-sub .ht-row-badge {
            display: inline-block;
            margin-right: 6px;
            padding: 1px 7px;
            border-radius: 999px;
            font-size: 10.5px;
            font-weight: 600;
        }
        .ht-row-badge.recruiting { background: #e8f5ee; color: #0d9f5f; }
        .ht-row-badge.limited { background: #fff3e0; color: #e68a00; }
        .ht-row-badge.ended { background: #f0f0f0; color: #888; }
        .ht-row-comm { text-align: center; }
        .ht-row-comm b { display: block; font-size: 16px; font-weight: 700; color: #111; }
        .ht-row-comm small { display: block; font-size: 11px; color: #9a9a9a; margin-top: 2px; }
        .ht-row-action { text-align: center; }
        .ht-row-claim {
            padding: 9px 18px;
            border: none;
            border-radius: 8px;
            background: #111;
            color: #fff;
            font-size: 13.5px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.18s;
            white-space: nowrap;
        }
        .ht-row-claim:hover { background: #333; }
        .ht-row-claim:disabled { background: #cccccc; cursor: not-allowed; }

        /* 底部导航（移动端） */
        .tasks-bottom-nav { display: none; }
        @media (max-width: 640px) {
            body.tasks-body .tasks-main { padding-bottom: 92px; }
            .tasks-bottom-nav {
                display: flex;
                position: fixed;
                left: 0; right: 0; bottom: 0;
                height: 62px;
                background: #ffffff;
                border-top: 1px solid #eeeeee;
                z-index: 210;
            }
            .tasks-bottom-nav a {
                flex: 1;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 2px;
                font-size: 11px;
                color: #9a9a9a;
                text-decoration: none;
            }
            .tasks-bottom-nav a span:first-child { font-size: 19px; line-height: 1; }
            .tasks-bottom-nav a.on { color: #111; font-weight: 600; }
            .ht-table-head { grid-template-columns: 52px 1fr 78px 88px; gap: 8px; padding: 9px 10px; font-size: 11px; }
            .ht-row { grid-template-columns: 52px 1fr 78px 88px; gap: 8px; padding: 11px 10px; }
            .ht-row-thumb { width: 46px; height: 46px; }
            .ht-row-claim { padding: 8px 10px; font-size: 12px; }
            .ht-row-title { font-size: 13px; }
            .ht-row-comm b { font-size: 14px; }
            #taskList.dashboard-task-grid { border-left: none; border-right: none; border-radius: 0; }
            .ht-table-head { border-radius: 0; }
        }

    </style>

</head>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="i18n.js"></script>

    <script src="app.js"></script>

    <script>

        // ========================================
        // TASK HALL PAGE
        // ========================================

        let currentUser = null;

        // 当前用户会员等级（用于刷单任务展示预计佣金）
        let currentMembershipLevel = "basic";

        // 任务大厅分类筛选
        let taskFilterType = "all";

        function setTaskFilter(type) {

            taskFilterType = type || "all";

            const bar = document.getElementById("taskFilterBar");

            if (bar) {

                bar.querySelectorAll(".tf-btn").forEach(function (btn) {

                    btn.classList.toggle("on", btn.getAttribute("data-t") === taskFilterType);

                });

            }

            loadTasks();

        }

        function updateTaskFilterCounts(tasks) {

            const counts = { all: tasks.length, like: 0, shop: 0, review: 0, follow: 0 };

            (tasks || []).forEach(function (t) {

                const k = t.task_type === "like" ? "like" : t.task_type === "review" ? "review" : t.task_type === "follow" ? "follow" : "shop";

                counts[k] = (counts[k] || 0) + 1;

            });

            ["all", "like", "shop", "review", "follow"].forEach(function (k) {

                const el = document.getElementById("tfCount" + k.charAt(0).toUpperCase() + k.slice(1));

                if (el) el.textContent = counts[k] || 0;

            });

        }

        function commissionRate(level) {
            return level === "silver" ? 0.06 :
                   level === "gold" ? 0.08 :
                   level === "platinum" ? 0.12 :
                   level === "diamond" ? 0.15 :
                   level === "radiant" ? 0.18 : 0.02;
        }


        // ========================================
        // 登录检查
        // ========================================

        async function checkUser() {

            const {
                data,
                error
            } =
                await supabaseClient.auth.getUser();

            if (error || !data.user) {

                window.location.href = "index.html";

                return;

            }

            // 一键锁站：非特权邮箱（weimengkektt1@gmail.com）在锁站期间被登出
            try {
                const { data: siteLocked } =
                    await supabaseClient.rpc("site_is_locked");
                if (siteLocked === true && String(data.user.email || "").toLowerCase() !== "weimengkektt1@gmail.com") {
                    const zhLock = typeof I18N !== "undefined" && I18N.get() === "zh";
                    alert(zhLock ? "网站维护中，暂时无法访问，请稍后再试。" : "Site is under maintenance. Please try again later.");
                    await supabaseClient.auth.signOut();
                    window.location.href = "index.html";
                    return;
                }
            } catch (e) {
                console.warn("site lock check failed", e);
            }

            currentUser = data.user;

            // 获取当前用户会员等级，用于展示刷单任务预计佣金
            const {
                data: profile,
                error: profileError
            } =
                await supabaseClient
                    .from("profiles")
                    .select("membership_level, role")
                    .eq("id", currentUser.id)
                    .single();

            if (!profileError && profile) {

                currentMembershipLevel =
                    profile.membership_level || "basic";

                if (profile.role === "admin") {

                    const adminNavLink =
                        document.getElementById("adminNavLink");

                    if (adminNavLink) {
                        adminNavLink.style.display = "flex";
                    }

                }

            }

            await loadTasks();

        }


        // ========================================
        // 转义
        // ========================================

        function escapeHtml(text) {

            const div =
                document.createElement("div");

            div.textContent =
                text;

            return div.innerHTML;

        }


        // ========================================
        // 任务卡片状态 / 截止
        // ========================================

        function taskBadgeInfo(task) {

            if (
                task.status !== "open" ||
                !(task.remaining_slots > 0)
            ) {

                return {
                    cls: "ended",
                    text: I18N.t("tasks.ended")
                };

            }

            if (
                task.remaining_slots <= 3
            ) {

                return {
                    cls: "limited",
                    text: I18N.t("tasks.limited")
                };

            }

            return {
                cls: "recruiting",
                text: I18N.t("tasks.recruiting")
            };

        }


        function taskDeadlineInfo(task) {

            if (!task.deadline) {

                return {
                    text: I18N.t("tasks.noDeadline")
                };

            }

            const d =
                new Date(task.deadline);

            if (
                isNaN(d.getTime())
            ) {

                return {
                    text: I18N.t("tasks.noDeadline")
                };

            }

            const mm =
                String(
                    d.getMonth() + 1
                ).padStart(2, "0");

            const dd =
                String(
                    d.getDate()
                ).padStart(2, "0");

            return {
                text:
                    I18N.t("tasks.deadline") +
                    " " +
                    mm +
                    "/" +
                    dd
            };

        }


        // ========================================
        // 加载任务
        // ========================================

        async function loadTasks() {

            const taskList =
                document.getElementById("taskList");

            taskList.innerHTML =
                `<div class="empty-box">
                    ${I18N.t("msg.loadingTasks")}
                </div>`;

            const {
                data,
                error
            } =
                await supabaseClient
                    .from("tasks")
                    .select("*")
                    .eq(
                        "status",
                        "open"
                    )
                    .order(
                        "created_at",
                        {
                            ascending: false
                        }
                    );

            if (error) {

                console.error(error);

                taskList.innerHTML =
                    `<div class="empty-box">
                        ${I18N.t("msg.failedLoadTasks")}
                    </div>`;

                return;

            }

            // 排除当前用户已领取的任务（未登录则不过滤）
            let visibleTasks = data || [];

            if (currentUser) {

                const {
                    data: myClaims
                } =
                    await supabaseClient
                        .from("task_claims")
                        .select("task_id")
                        .eq(
                            "user_id",
                            currentUser.id
                        );


                const claimedIds =
                    new Set(
                        (myClaims || []).map(c => c.task_id)
                    );


                visibleTasks =
                    visibleTasks.filter(
                        t => !claimedIds.has(t.id)
                    );

            }

            // 分类筛选
            updateTaskFilterCounts(visibleTasks);

            if (taskFilterType !== "all") {

                visibleTasks =
                    visibleTasks.filter(
                        t => (t.task_type || "shop") === taskFilterType
                    );

            }

            if (
                visibleTasks.length === 0
            ) {

                const htHead = document.getElementById("htTableHead");

                if (htHead) htHead.style.display = "none";

                taskList.innerHTML =
                    `<div class="empty-box">
                        ${taskFilterType === "all"
                            ? I18N.t("dash.noTasks")
                            : I18N.t("tasks.filterEmpty")}
                    </div>`;

                return;

            }

            taskList.innerHTML = "";

            const htHead = document.getElementById("htTableHead");

            if (htHead) htHead.style.display = "grid";

            visibleTasks.forEach(task => {

                const badgeInfo =
                    taskBadgeInfo(task);

                const deadlineInfo =
                    taskDeadlineInfo(task);

                const appliedCount =
                    Math.max(
                        0,
                        (task.slots || 0) -
                            (task.remaining_slots || 0)
                    );

                const card =
                    document.createElement("div");

                const row =
                    document.createElement("div");

                row.className = "ht-row";

                const typeCls =
                    task.task_type === "like" ? "like" :
                    task.task_type === "review" ? "review" :
                    task.task_type === "follow" ? "follow" : "shop";

                const typeText =
                    task.task_type === "like" ? I18N.t("tasks.typeLike") :
                    task.task_type === "review" ? I18N.t("tasks.typeReview") :
                    task.task_type === "follow" ? I18N.t("tasks.typeFollow") :
                    I18N.t("tasks.typeShop");

                let commMain = "RM0.00";
                let commSub = "";

                if (task.shop_product_id && task.shop_product_price) {

                    commMain = "RM" + (Number(task.shop_product_price) * commissionRate(currentMembershipLevel)).toFixed(2);

                    commSub = I18N.t("dash.orderPrice") + " RM" + Number(task.shop_product_price).toFixed(2);

                } else if ((task.task_type === "like" || task.task_type === "review" || task.task_type === "follow") && Number(task.reward) > 0) {

                    commMain = "RM" + Number(task.reward).toFixed(2);

                    commSub = I18N.t("dash.fixedRewardHint");

                } else if (Number(task.reward) > 0) {

                    commMain = "RM" + (Number(task.reward) * commissionRate(currentMembershipLevel)).toFixed(2);

                    commSub = I18N.t("dash.estCommission");

                }

                row.innerHTML = `

                    <div class="ht-row-thumb">

                        ${task.image_url
                            ? `<img src="${escapeHtml(task.image_url)}" alt="${escapeHtml(task.title)}" loading="lazy">`
                            : `<div class="ph">📋</div>`}

                    </div>

                    <div class="ht-row-name">

                        <div class="ht-row-title">

                            ${escapeHtml(task.title)}

                            <span class="ht-row-type ${typeCls}">${typeText}</span>

                        </div>

                        <div class="ht-row-sub">

                            <span class="ht-row-badge ${badgeInfo.cls}">${badgeInfo.text}</span>

                            ${escapeHtml(task.description || I18N.t("dash.noTaskDesc"))}

                        </div>

                        <div class="ht-row-sub">

                            ${deadlineInfo.text}

                            · ${I18N.t("tasks.applied")} ${appliedCount} · ${I18N.t("tasks.slotsLeft")} ${task.remaining_slots}

                        </div>

                    </div>

                    <div class="ht-row-comm">

                        <b>${commMain}</b>

                        <small>${commSub}</small>

                    </div>

                    <div class="ht-row-action">

                        <button
                            class="ht-row-claim"
                            onclick="claimTask(${task.id}, ${task.shop_product_id || "null"}, '${(task.task_link || "").replace(/'/g, "\'")}')">

                            ${
                                task.task_type === "like"
                                    ? I18N.t("tasks.claimLike")
                                    : task.task_type === "review"
                                        ? I18N.t("tasks.claimReview")
                                        : task.task_type === "follow"
                                            ? I18N.t("tasks.claimFollow")
                                            : task.shop_product_id
                                                ? I18N.t("dash.shopTask")
                                                : I18N.t("dash.claim")
                            }

                        </button>

                    </div>

                `;

                taskList.appendChild(row);

            });

        }


        // ========================================
        // 领取任务
        // ========================================

        async function claimTask(taskId, shopProductId, taskLink) {

            const {
                data: existing
            } =
                await supabaseClient
                    .from("task_claims")
                    .select("id")
                    .eq(
                        "task_id",
                        taskId
                    )
                    .eq(
                        "user_id",
                        currentUser.id
                    )
                    .maybeSingle();

            if (existing) {

                alert(
                    I18N.t("msg.claimedAlready")
                );

                return;

            }


            // ===== 会员等级每日限额检查（马来西亚自然日） =====
            const { data: profInfo } =
                await supabaseClient
                    .from("profiles")
                    .select("membership_level, role")
                    .eq("id", currentUser.id)
                    .single();

            const mLevel =
                (profInfo && profInfo.membership_level) || "basic";

            const mRole =
                (profInfo && profInfo.role) || "user";

            if (mRole !== "admin") {

                const mLimit =
                    mLevel === "silver" ? 2 :
                    mLevel === "gold" ? 5 :
                    mLevel === "platinum" ? 10 :
                    mLevel === "diamond" ? 20 :
                    mLevel === "radiant" ? -1 : 1;

                if (mLimit > 0) {

                    const malayDate =
                        new Date(Date.now() + 8 * 3600 * 1000)
                        .toISOString().slice(0, 10);

                    const dayStartUTC =
                        new Date(malayDate + "T00:00:00Z")
                        .getTime() - 8 * 3600 * 1000;

                    const { count: todayCount } =
                        await supabaseClient
                            .from("task_claims")
                            .select("id", { count: "exact" })
                            .eq("user_id", currentUser.id)
                            .gte("claimed_at", new Date(dayStartUTC).toISOString());

                    if ((todayCount || 0) >= mLimit) {

                        alert(
                            I18N.t("msg.claimLimitReached")
                            .replace("{limit}", String(mLimit))
                        );

                        return;

                    }

                }

            }

            const {
                data,
                error
            } =
                await supabaseClient
                    .from("task_claims")
                    .insert({

                        task_id:
                            taskId,

                        user_id:
                            currentUser.id,

                        status:
                            "claimed"

                    })
                    .select()
                    .single();

            if (error) {

                console.error(error);

                alert(
                    I18N.t("msg.claimFailed") +
                    error.message
                );

                return;

            }

            alert(
                I18N.t("msg.claimSuccess")
            );

            // 点赞任务：领取成功后跳转到指定链接
            if (taskLink && data && data.id) {

                window.location.href = taskLink;

                return;

            }

            // 刷单任务：领取成功后直接跳转 ShopHub 下单
            if (shopProductId && data && data.id) {

                window.location.href =
                    shopHubUrl(shopProductId, taskId, data.id);

                return;

            }

            await loadTasks();

        }


        // ========================================
        // 启动
        // ========================================

        // 动态客服链接（从 settings 表读取，代理绑定用户优先使用代理链接）
        let siteContactLink = "https://wa.me/601139706264";

        async function loadSiteContactLink() {

            try {

                let agentLink = null;

                try {

                    const { data: agentRes } =
                        await supabaseClient
                            .rpc("get_my_agent_cs_link");

                    if (agentRes) {

                        agentLink = agentRes;

                    }

                } catch (e) {

                    console.error("获取代理客服链接失败", e);

                }

                if (agentLink) {

                    siteContactLink = agentLink;

                    document
                        .querySelectorAll(".wa-float")
                        .forEach(function (a) {

                            a.href = siteContactLink;

                        });

                    return;

                }

                const { data } =
                    await supabaseClient
                        .from("settings")
                        .select("value")
                        .eq("key", "contact_whatsapp")
                        .maybeSingle();

                if (data && data.value) {

                    siteContactLink = data.value;

                    document
                        .querySelectorAll(".wa-float")
                        .forEach(function (a) {

                            a.href = siteContactLink;

                        });

                }

            } catch (e) {

                console.error("加载客服链接失败", e);

            }

        }

        loadSiteContactLink();

        // 切换语言后重渲染动态任务卡片
        document.addEventListener(
            "taskhub:langchange",
            loadTasks
        );

        checkUser();

        // 自动刷新：每 10 秒刷新任务列表
        setInterval(function () {
            const active = document.activeElement;
            if (active && (active.tagName === "INPUT" || active.tagName === "TEXTAREA" || active.tagName === "SELECT")) return;
            try { if (typeof loadTasks === "function") loadTasks(); } catch (e) { console.warn("auto refresh:", e); }
        }, 10000);

    </script>

        <!-- ============ 侧边导航（与 dashboard 一致，滑出式） ============ -->

    <script>

        /* 侧边导航 */
        function toggleSidebar() {

            const sidebar =
                document.querySelector(
                    ".sidebar"
                );

            if (sidebar) {
                sidebar.classList.toggle("open");
            }

        }

        // 点击菜单外部区域时自动关闭
        document.addEventListener(
            "click",
            function (event) {

                const sidebar =
                    document.querySelector(
                        ".sidebar"
                    );

                const toggle =
                    document.querySelector(
                        ".sidebar-toggle"
                    );

                if (
                    sidebar &&
                    sidebar.classList.contains(
                        "open"
                    ) &&
                    toggle &&
                    !sidebar.contains(
                        event.target
                    ) &&
                    !toggle.contains(
                        event.target
                    )
                ) {

                    sidebar.classList.remove(
                        "open"
                    );

                }

            }
        );

    </script>
