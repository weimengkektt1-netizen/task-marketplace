<head>

        name="viewport"

    <link
        rel="stylesheet"

    <style>

        /* =========================
           任务大厅独立页
        ========================= */

        body.tasks-body {
            margin: 0;
            min-height: 100vh;
            background: #0c0f15;
            color: #e8ecf2;
            font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
        }

        .tasks-header {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 14px 28px;
            background: rgba(12, 15, 21, 0.88);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #1d222c;
        }

        .tasks-logo-link {
            display: flex;
            align-items: center;
            gap: 11px;
            text-decoration: none;
            color: inherit;
        }

        .tasks-logo-icon {
            background: linear-gradient(135deg, #6d5dfc, #4c8dff);
            color: #fff;
            box-shadow: 0 4px 14px rgba(109, 93, 252, 0.35);
        }

        .tasks-logo-text {
            font-size: 18px;
            font-weight: 700;
            color: #f5f7fa;
        }

        .tasks-header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .tasks-back-btn {
            display: inline-flex;
            align-items: center;
            padding: 9px 16px;
            border-radius: 10px;
            border: 1px solid #2a303a;
            background: rgba(255, 255, 255, 0.04);
            color: #c6ccd6;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.18s ease;
        }

        .tasks-back-btn:hover {
            border-color: #6d5dfc;
            background: rgba(109, 93, 252, 0.12);
            color: #fff;
        }

        .tasks-logout-btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 9px 16px;
            border-radius: 10px;
            border: 1px solid #2a303a;
            background: rgba(255, 255, 255, 0.04);
            color: #c6ccd6;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.18s ease;
        }

        .tasks-logout-btn:hover {
            border-color: rgba(255, 82, 82, 0.5);
            background: rgba(255, 82, 82, 0.1);
            color: #ff8a8a;
        }

        .tasks-main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 34px 28px 60px;
        }

        .tasks-main .dashboard-section-title {
            margin-bottom: 26px;
        }

        .tasks-hint {
            margin: -14px 0 24px;
            font-size: 12px;
            color: #5c6470;
        }

        .tasks-page .dashboard-task-grid {
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        @media (max-width: 640px) {

            .tasks-header {
                padding: 12px 16px;
            }

            .tasks-logo-text {
                display: none;
            }

            .tasks-back-btn span,
            .tasks-logout-btn span {
                display: none;
            }

            .tasks-main {
                padding: 24px 16px 48px;
            }

        }

        /* =========================
           刷单任务：订单总价 + 预计佣金
        ========================= */

        .ht-commission {
            margin-top: 10px;
            padding: 9px 11px;
            border-radius: 12px;
            background: rgba(34, 197, 94, 0.10);
            border: 1px solid rgba(34, 197, 94, 0.28);
            display: grid;
            gap: 4px;
        }

        .ht-commission > div {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .ht-commission span {
            font-size: 12px;
            color: #94a3b8;
        }

        .ht-commission b {
            font-size: 13px;
            color: #e2e8f0;
            font-weight: 700;
        }

        .ht-commission .ht-commission-value {
            font-size: 15px;
            color: #22c55e;
        }

        /* =========================
           侧边导航（与 dashboard 一致，滑出式）
        ========================= */

        .tasks-header .sidebar-toggle {
            margin-bottom: 0;
            flex: none;
        }

        @media (min-width: 601px) {

            body.tasks-body .sidebar {
                transform: translateX(-100%);
                transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
                z-index: 210;
                box-shadow: 30px 0 60px rgba(0, 0, 0, 0.35);
            }

            body.tasks-body .sidebar-edge-zone:hover + .sidebar,
            body.tasks-body .sidebar:hover,
            body.tasks-body .sidebar:focus-within {
                transform: translateX(0);
            }

            body.tasks-body .sidebar-edge-zone:hover,
            body.tasks-body .sidebar:hover ~ .sidebar-edge-zone {
                opacity: 0.35;
            }

        }
    </style>

</head>

    <script>

        // ========================================
        // TASK HALL PAGE
        // ========================================

        let currentUser = null;

        // 当前用户会员等级（用于刷单任务展示预计佣金）
        let currentMembershipLevel = "basic";

        function commissionRate(level) {
            return level === "silver" ? 0.06 :
                   level === "gold" ? 0.08 :
                   level === "platinum" ? 0.12 :
                   level === "diamond" ? 0.15 :
                   level === "radiant" ? 0.18 : 0.02;
        }


        // ========================================
        // 登录检查
        // ========================================

        async function checkUser() {

            const {
                data,
                error
            } =
                await supabaseClient.auth.getUser();

            if (error || !data.user) {

                window.location.href = "index.html";

                return;

            }

            currentUser = data.user;

            // 获取当前用户会员等级，用于展示刷单任务预计佣金
            const {
                data: profile,
                error: profileError
            } =
                await supabaseClient
                    .from("profiles")
                    .select("membership_level, role")
                    .eq("id", currentUser.id)
                    .single();

            if (!profileError && profile) {

                currentMembershipLevel =
                    profile.membership_level || "basic";

                if (profile.role === "admin") {

                    const adminNavLink =
                        document.getElementById("adminNavLink");

                    if (adminNavLink) {
                        adminNavLink.style.display = "flex";
                    }

                }

            }

            await loadTasks();

        }


        // ========================================
        // 转义
        // ========================================

        function escapeHtml(text) {

            const div =
                document.createElement("div");

            div.textContent =
                text;

            return div.innerHTML;

        }


        // ========================================
        // 任务卡片状态 / 截止
        // ========================================

        function taskBadgeInfo(task) {

            if (
                task.status !== "open" ||
                !(task.remaining_slots > 0)
            ) {

                return {
                    cls: "ended",
                    text: I18N.t("tasks.ended")
                };

            }

            if (
                task.remaining_slots <= 3
            ) {

                return {
                    cls: "limited",
                    text: I18N.t("tasks.limited")
                };

            }

            return {
                cls: "recruiting",
                text: I18N.t("tasks.recruiting")
            };

        }


        function taskDeadlineInfo(task) {

            if (!task.deadline) {

                return {
                    text: I18N.t("tasks.noDeadline")
                };

            }

            const d =
                new Date(task.deadline);

            if (
                isNaN(d.getTime())
            ) {

                return {
                    text: I18N.t("tasks.noDeadline")
                };

            }

            const mm =
                String(
                    d.getMonth() + 1
                ).padStart(2, "0");

            const dd =
                String(
                    d.getDate()
                ).padStart(2, "0");

            return {
                text:
                    I18N.t("tasks.deadline") +
                    " " +
                    mm +
                    "/" +
                    dd
            };

        }


        // ========================================
        // 加载任务
        // ========================================

        async function loadTasks() {

            const taskList =
                document.getElementById("taskList");

            taskList.innerHTML =
                `<div class="empty-box">
                    ${I18N.t("msg.loadingTasks")}
                </div>`;

            const {
                data,
                error
            } =
                await supabaseClient
                    .from("tasks")
                    .select("*")
                    .eq(
                        "status",
                        "open"
                    )
                    .order(
                        "created_at",
                        {
                            ascending: false
                        }
                    );

            if (error) {

                console.error(error);

                taskList.innerHTML =
                    `<div class="empty-box">
                        ${I18N.t("msg.failedLoadTasks")}
                    </div>`;

                return;

            }

            // 排除当前用户已领取的任务（未登录则不过滤）
            let visibleTasks = data || [];

            if (currentUser) {

                const {
                    data: myClaims
                } =
                    await supabaseClient
                        .from("task_claims")
                        .select("task_id")
                        .eq(
                            "user_id",
                            currentUser.id
                        );


                const claimedIds =
                    new Set(
                        (myClaims || []).map(c => c.task_id)
                    );


                visibleTasks =
                    visibleTasks.filter(
                        t => !claimedIds.has(t.id)
                    );

            }

            if (
                visibleTasks.length === 0
            ) {

                taskList.innerHTML =
                    `<div class="empty-box">
                        ${I18N.t("dash.noTasks")}
                    </div>`;

                return;

            }

            taskList.innerHTML = "";

            visibleTasks.forEach(task => {

                const badgeInfo =
                    taskBadgeInfo(task);

                const deadlineInfo =
                    taskDeadlineInfo(task);

                const appliedCount =
                    Math.max(
                        0,
                        (task.slots || 0) -
                            (task.remaining_slots || 0)
                    );

                const card =
                    document.createElement("div");

                card.className =
                    "dashboard-task-card ht-task-card";

                card.innerHTML = `

                    <div class="ht-card-media">

                        ${task.image_url
                            ? `<img src="${escapeHtml(task.image_url)}" alt="${escapeHtml(task.title)}" loading="lazy">`
                            : `<div class="ht-card-placeholder">📋</div>`}

                        <span class="ht-badge ht-badge-${badgeInfo.cls}">
                            ${badgeInfo.text}
                        </span>

                        <span class="ht-deadline">
                            ${deadlineInfo.text}
                        </span>

                    </div>

                    <div class="ht-card-body">

                        <h3>
                            ${escapeHtml(task.title)}
                            <span class="ht-type-badge ${task.task_type === "like" ? "like" : task.task_type === "review" ? "review" : task.task_type === "follow" ? "follow" : "shop"}">
                                ${task.task_type === "like"
                                    ? I18N.t("tasks.typeLike")
                                    : task.task_type === "review"
                                        ? I18N.t("tasks.typeReview")
                                        : task.task_type === "follow"
                                            ? I18N.t("tasks.typeFollow")
                                            : I18N.t("tasks.typeShop")}
                            </span>
                        </h3>

                        <p class="ht-card-desc">
                            ${escapeHtml(
                                task.description ||
                                I18N.t("dash.noTaskDesc")
                            )}
                        </p>

                        ${
                            task.shop_product_id && task.shop_product_price
                                ? `
                                <div class="ht-commission">
                                    <div>
                                        <span>${I18N.t("dash.orderPrice")}</span>
                                        <b>RM${Number(task.shop_product_price).toFixed(2)}</b>
                                    </div>
                                    <div>
                                        <span>${I18N.t("dash.estCommission")}</span>
                                        <b class="ht-commission-value">RM${(Number(task.shop_product_price) * commissionRate(currentMembershipLevel)).toFixed(2)}</b>
                                    </div>
                                </div>
                                `
                                : ""
                        }

                        <div class="ht-slots">
                            ${I18N.t("tasks.applied")} ${appliedCount} ·
                            ${I18N.t("tasks.slotsLeft")} <strong>${task.remaining_slots}</strong>
                        </div>

                        <button
                            class="task-action-btn"
                            onclick="claimTask(${task.id}, ${task.shop_product_id || "null"}, '${(task.task_link || "").replace(/'/g, "\\'")}')">

                            ${
                                task.task_type === "like"
                                    ? I18N.t("tasks.claimLike")
                                    : task.task_type === "review"
                                        ? I18N.t("tasks.claimReview")
                                        : task.task_type === "follow"
                                            ? I18N.t("tasks.claimFollow")
                                            : task.shop_product_id
                                                ? I18N.t("dash.shopTask")
                                                : I18N.t("dash.claim")
                            }

                        </button>

                    </div>

                `;

                taskList.appendChild(card);

            });

        }


        // ========================================
        // 领取任务
        // ========================================

        async function claimTask(taskId, shopProductId, taskLink) {

            const {
                data: existing
            } =
                await supabaseClient
                    .from("task_claims")
                    .select("id")
                    .eq(
                        "task_id",
                        taskId
                    )
                    .eq(
                        "user_id",
                        currentUser.id
                    )
                    .maybeSingle();

            if (existing) {

                alert(
                    I18N.t("msg.claimedAlready")
                );

                return;

            }


            // ===== 会员等级每日限额检查（马来西亚自然日） =====
            const { data: profInfo } =
                await supabaseClient
                    .from("profiles")
                    .select("membership_level, role")
                    .eq("id", currentUser.id)
                    .single();

            const mLevel =
                (profInfo && profInfo.membership_level) || "basic";

            const mRole =
                (profInfo && profInfo.role) || "user";

            if (mRole !== "admin") {

                const mLimit =
                    mLevel === "silver" ? 2 :
                    mLevel === "gold" ? 5 :
                    mLevel === "platinum" ? 10 :
                    mLevel === "diamond" ? 20 :
                    mLevel === "radiant" ? -1 : 1;

                if (mLimit > 0) {

                    const malayDate =
                        new Date(Date.now() + 8 * 3600 * 1000)
                        .toISOString().slice(0, 10);

                    const dayStartUTC =
                        new Date(malayDate + "T00:00:00Z")
                        .getTime() - 8 * 3600 * 1000;

                    const { count: todayCount } =
                        await supabaseClient
                            .from("task_claims")
                            .select("id", { count: "exact" })
                            .eq("user_id", currentUser.id)
                            .gte("claimed_at", new Date(dayStartUTC).toISOString());

                    if ((todayCount || 0) >= mLimit) {

                        alert(
                            I18N.t("msg.claimLimitReached")
                            .replace("{limit}", String(mLimit))
                        );

                        return;

                    }

                }

            }

            const {
                data,
                error
            } =
                await supabaseClient
                    .from("task_claims")
                    .insert({

                        task_id:
                            taskId,

                        user_id:
                            currentUser.id,

                        status:
                            "claimed"

                    })
                    .select()
                    .single();

            if (error) {

                console.error(error);

                alert(
                    I18N.t("msg.claimFailed") +
                    error.message
                );

                return;

            }

            alert(
                I18N.t("msg.claimSuccess")
            );

            // 点赞任务：领取成功后跳转到指定链接
            if (taskLink && data && data.id) {

                window.location.href = taskLink;

                return;

            }

            // 刷单任务：领取成功后直接跳转 ShopHub 下单
            if (shopProductId && data && data.id) {

                window.location.href =
                    shopHubUrl(shopProductId, taskId, data.id);

                return;

            }

            await loadTasks();

        }


        // ========================================
        // 启动
        // ========================================

        // 切换语言后重渲染动态任务卡片
        document.addEventListener(
            "taskhub:langchange",
            loadTasks
        );

        checkUser();

    </script>

    <script>

        /* 侧边导航 */
        function toggleSidebar() {

            const sidebar =
                document.querySelector(
                    ".sidebar"
                );

            if (sidebar) {
                sidebar.classList.toggle("open");
            }

        }

        // 点击菜单外部区域时自动关闭
        document.addEventListener(
            "click",
            function (event) {

                const sidebar =
                    document.querySelector(
                        ".sidebar"
                    );

                const toggle =
                    document.querySelector(
                        ".sidebar-toggle"
                    );

                if (
                    sidebar &&
                    sidebar.classList.contains(
                        "open"
                    ) &&
                    toggle &&
                    !sidebar.contains(
                        event.target
                    ) &&
                    !toggle.contains(
                        event.target
                    )
                ) {

                    sidebar.classList.remove(
                        "open"
                    );

                }

            }
        );

    </script>
