<!DOCTYPE html>
<html lang="zh">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>TaskHub - 任务大厅</title>

    <link
        rel="stylesheet"
        href="style.css">

    <style>

        /* =========================
           任务大厅独立页
        ========================= */

        body.tasks-body {
            margin: 0;
            min-height: 100vh;
            background: #0c0f15;
            color: #e8ecf2;
            font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
        }

        .tasks-header {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 14px 28px;
            background: rgba(12, 15, 21, 0.88);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #1d222c;
        }

        .tasks-logo-link {
            display: flex;
            align-items: center;
            gap: 11px;
            text-decoration: none;
            color: inherit;
        }

        .tasks-logo-icon {
            background: linear-gradient(135deg, #6d5dfc, #4c8dff);
            color: #fff;
            box-shadow: 0 4px 14px rgba(109, 93, 252, 0.35);
        }

        .tasks-logo-text {
            font-size: 18px;
            font-weight: 700;
            color: #f5f7fa;
        }

        .tasks-header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .tasks-back-btn {
            display: inline-flex;
            align-items: center;
            padding: 9px 16px;
            border-radius: 10px;
            border: 1px solid #2a303a;
            background: rgba(255, 255, 255, 0.04);
            color: #c6ccd6;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.18s ease;
        }

        .tasks-back-btn:hover {
            border-color: #6d5dfc;
            background: rgba(109, 93, 252, 0.12);
            color: #fff;
        }

        .tasks-logout-btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 9px 16px;
            border-radius: 10px;
            border: 1px solid #2a303a;
            background: rgba(255, 255, 255, 0.04);
            color: #c6ccd6;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.18s ease;
        }

        .tasks-logout-btn:hover {
            border-color: rgba(255, 82, 82, 0.5);
            background: rgba(255, 82, 82, 0.1);
            color: #ff8a8a;
        }

        .tasks-main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 34px 28px 60px;
        }

        .tasks-main .dashboard-section-title {
            margin-bottom: 26px;
        }

        .tasks-hint {
            margin: -14px 0 24px;
            font-size: 12px;
            color: #5c6470;
        }

        .tasks-page .dashboard-task-grid {
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        @media (max-width: 640px) {

            .tasks-header {
                padding: 12px 16px;
            }

            .tasks-logo-text {
                display: none;
            }

            .tasks-back-btn span,
            .tasks-logout-btn span {
                display: none;
            }

            .tasks-main {
                padding: 24px 16px 48px;
            }

        }

    </style>

</head>

<body class="tasks-body">

    <header class="tasks-header">

        <a
            href="dashboard.html"
            class="tasks-logo-link">

            <div class="logo-icon tasks-logo-icon">T</div>

            <span class="tasks-logo-text">TaskHub</span>

        </a>

        <div class="tasks-header-actions">

            <button
                type="button"
                class="lang-btn"
                onclick="I18N.toggle()"
                data-i18n-lang>EN</button>

            <a
                href="dashboard.html"
                class="tasks-back-btn">
                <span data-i18n="tasks.backToDashboard">返回仪表盘</span>
            </a>

            <button
                type="button"
                class="tasks-logout-btn"
                onclick="logout()">
                <span data-i18n="dash.logout">登出</span>
            </button>

        </div>

    </header>

    <main class="tasks-main">

        <div class="dashboard-section-title">

            <div>

                <span class="section-label">
                    TASK HALL
                </span>

                <h2>
                    <span data-i18n="dash.taskHall">任务大厅</span>
                </h2>

            </div>

        </div>

        <p class="tasks-hint">
            <span data-i18n="tasks.hint">领取后请在仪表盘的「我的任务」中提交完成证明。</span>
        </p>

        <div
            id="taskList"
            class="dashboard-task-grid">

            <div class="empty-box">
                <span data-i18n="msg.loadingTasks">正在加载任务...</span>
            </div>

        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="i18n.js"></script>

    <script src="app.js"></script>

    <script>

        // ========================================
        // TASK HALL PAGE
        // ========================================

        let currentUser = null;


        // ========================================
        // 登录检查
        // ========================================

        async function checkUser() {

            const {
                data,
                error
            } =
                await supabaseClient.auth.getUser();

            if (error || !data.user) {

                window.location.href = "index.html";

                return;

            }

            currentUser = data.user;

            await loadTasks();

        }


        // ========================================
        // 转义
        // ========================================

        function escapeHtml(text) {

            const div =
                document.createElement("div");

            div.textContent =
                text;

            return div.innerHTML;

        }


        // ========================================
        // 任务卡片状态 / 截止
        // ========================================

        function taskBadgeInfo(task) {

            if (
                task.status !== "open" ||
                !(task.remaining_slots > 0)
            ) {

                return {
                    cls: "ended",
                    text: I18N.t("tasks.ended")
                };

            }

            if (
                task.remaining_slots <= 3
            ) {

                return {
                    cls: "limited",
                    text: I18N.t("tasks.limited")
                };

            }

            return {
                cls: "recruiting",
                text: I18N.t("tasks.recruiting")
            };

        }


        function taskDeadlineInfo(task) {

            if (!task.deadline) {

                return {
                    text: I18N.t("tasks.noDeadline")
                };

            }

            const d =
                new Date(task.deadline);

            if (
                isNaN(d.getTime())
            ) {

                return {
                    text: I18N.t("tasks.noDeadline")
                };

            }

            const mm =
                String(
                    d.getMonth() + 1
                ).padStart(2, "0");

            const dd =
                String(
                    d.getDate()
                ).padStart(2, "0");

            return {
                text:
                    I18N.t("tasks.deadline") +
                    " " +
                    mm +
                    "/" +
                    dd
            };

        }


        // ========================================
        // 加载任务
        // ========================================

        async function loadTasks() {

            const taskList =
                document.getElementById("taskList");

            taskList.innerHTML =
                `<div class="empty-box">
                    ${I18N.t("msg.loadingTasks")}
                </div>`;

            const {
                data,
                error
            } =
                await supabaseClient
                    .from("tasks")
                    .select("*")
                    .eq(
                        "status",
                        "open"
                    )
                    .order(
                        "created_at",
                        {
                            ascending: false
                        }
                    );

            if (error) {

                console.error(error);

                taskList.innerHTML =
                    `<div class="empty-box">
                        ${I18N.t("msg.failedLoadTasks")}
                    </div>`;

                return;

            }

            if (
                !data ||
                data.length === 0
            ) {

                taskList.innerHTML =
                    `<div class="empty-box">
                        ${I18N.t("dash.noTasks")}
                    </div>`;

                return;

            }

            taskList.innerHTML = "";

            data.forEach(task => {

                const badgeInfo =
                    taskBadgeInfo(task);

                const deadlineInfo =
                    taskDeadlineInfo(task);

                const appliedCount =
                    Math.max(
                        0,
                        (task.slots || 0) -
                            (task.remaining_slots || 0)
                    );

                const card =
                    document.createElement("div");

                card.className =
                    "dashboard-task-card ht-task-card";

                card.innerHTML = `

                    <div class="ht-card-media">

                        ${task.image_url
                            ? `<img src="${escapeHtml(task.image_url)}" alt="${escapeHtml(task.title)}" loading="lazy">`
                            : `<div class="ht-card-placeholder">📋</div>`}

                        <span class="ht-badge ht-badge-${badgeInfo.cls}">
                            ${badgeInfo.text}
                        </span>

                        <span class="ht-deadline">
                            ${deadlineInfo.text}
                        </span>

                    </div>

                    <div class="ht-card-body">

                        <h3>
                            ${escapeHtml(task.title)}
                        </h3>

                        <p class="ht-card-desc">
                            ${escapeHtml(
                                task.description ||
                                I18N.t("dash.noTaskDesc")
                            )}
                        </p>

                        <div class="ht-reward">
                            RM${Number(task.reward).toFixed(2)}
                            <small>${I18N.t("tasks.perTask")}</small>
                        </div>

                        <div class="ht-slots">
                            ${I18N.t("tasks.applied")} ${appliedCount} ·
                            ${I18N.t("tasks.slotsLeft")} <strong>${task.remaining_slots}</strong>
                        </div>

                        <button
                            class="task-action-btn"
                            onclick="claimTask(${task.id})">

                            ${I18N.t("dash.claim")}

                        </button>

                    </div>

                `;

                taskList.appendChild(card);

            });

        }


        // ========================================
        // 领取任务
        // ========================================

        async function claimTask(taskId) {

            const {
                data: existing
            } =
                await supabaseClient
                    .from("task_claims")
                    .select("id")
                    .eq(
                        "task_id",
                        taskId
                    )
                    .eq(
                        "user_id",
                        currentUser.id
                    )
                    .maybeSingle();

            if (existing) {

                alert(
                    I18N.t("msg.claimedAlready")
                );

                return;

            }

            const {
                data,
                error
            } =
                await supabaseClient
                    .from("task_claims")
                    .insert({

                        task_id:
                            taskId,

                        user_id:
                            currentUser.id,

                        status:
                            "claimed"

                    })
                    .select()
                    .single();

            if (error) {

                console.error(error);

                alert(
                    I18N.t("msg.claimFailed") +
                    error.message
                );

                return;

            }

            alert(
                I18N.t("msg.claimSuccess")
            );

            await loadTasks();

        }


        // ========================================
        // 启动
        // ========================================

        // 切换语言后重渲染动态任务卡片
        document.addEventListener(
            "taskhub:langchange",
            loadTasks
        );

        checkUser();

    </script>

    <footer class="site-footer">
        <div class="footer-inner">
            <div class="footer-brand">
                <div class="footer-logo-icon">T</div>
                <div class="footer-brand-name">TaskHub</div>
            </div>
            <div class="footer-copy">© TaskHub 2026</div>
        </div>
    </footer>

        <span class="wa-float-text" data-i18n="common.contactSupport">联系客服</span>
    </a>


</body>

</html>
